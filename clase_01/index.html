<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header id="principal">
      <h1>Logo</h1>
      <nav>
        <a href="#">Inicio</a>
        <a href="#">Acerca de</a>
        <a href="#">Contacto</a>
      </nav>
    </header>

    <main>
      <h2>Main</h2>
      <section>
        <h2>Seccion</h2>
        <article>
          <h3>Articulo</h3>
          <form action="">
            <fieldset>
              <legend>Form de Login</legend>
              <label for="email">Email</label>
              <input
                placeholder="Ingrese su email"
                type="email"
                id="email"
                name="email"
                required
              />
              <label for="password">Contraseña</label>
              <input
                placeholder="Ingrese su contraseña"
                type="password"
                id="password"
                name="password"
                required
              />
            </fieldset>
            <button type="submit">Ingresar</button>
          </form>
        </article>
        <!-- -- OTRO -- -->
      </section>
    </main>
    <footer>
      <h6>Derechos reservados UTPL</h6>
    </footer>
  </body>
</html>
